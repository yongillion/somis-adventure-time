<!doctype html><html><head><meta charset="utf-8"><title>zoo review</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{width:100%;height:100%;display:block}
.lb{position:fixed;transform:translate(-50%,0);color:#2a2a44;font:bold 12px sans-serif;background:rgba(255,255,255,.65);padding:1px 5px;border-radius:6px;pointer-events:none;white-space:nowrap}</style></head>
<body><canvas id="c"></canvas>
<script type="module">
// Review tool for character models (own test page; complements viewer.html).
// Params:
//  mod=animals fn=buildAnimal ids=cat,dog|all  anim=idle ak=punch sk=cast cols=5 sp=1.6 dist=0 h=0.8 elev=0.35
//  yaw=0.35 | yaws=0,1.57,3.14 (per cell)  anims=idle,walk (per cell)  t=<fixed st.t>  pre=<seconds pre-sim>
//  labels=1  stats=1 (console JSON: meshes, minY, maxY)  speed vy  bg=hex  freeze=1 (stop after pre-sim)
//  rsp=<row spacing factor> tx/ty=<camera target> maxf=<stop rendering after N frames (fast, deterministic shots)>
//  neck=<giraffe rig.neckExt scale.y>  rtilt/rpitch/ryaw/rs/rout/rroll=<ribbon overrides, comma list per cell>
//  timing=1 (console: cold/warm build ms per id)   fn=buildSomiGirl: ids containing 'cape' get {cape:true}
import { Renderer } from '../js/engine/renderer.js';
import { Scene, Mesh, Camera } from '../js/engine/scene.js';
import { Material } from '../js/engine/material.js';
import * as G from '../js/engine/geometry.js';
import { Vec3 } from '../js/engine/math.js';
import { makeParticleAtlas } from '../js/engine/texgen.js';
import { BillboardBatch } from '../js/engine/particles.js';
const q = new URLSearchParams(location.search);
const modName = q.get('mod') || 'animals';
const fnName = q.get('fn') || 'buildAnimal';
const mod = await import(`../js/game/models/${modName}.js`);
let ids = (q.get('ids') || 'cat').split(',');
if (ids[0] === 'all' && mod.ANIMAL_SPECS) ids = Object.keys(mod.ANIMAL_SPECS);
const anims = (q.get('anims') || '').split(',').filter(Boolean);
const anim = q.get('anim') || 'idle';
const cols = +(q.get('cols') || Math.min(ids.length, 6));
const spacing = +(q.get('sp') || 1.6);
const yaw = +(q.get('yaw') || 0.35);
const yaws = (q.get('yaws') || '').split(',').filter(Boolean).map(Number);
const camDist = +(q.get('dist') || 0);
const camH = +(q.get('h') || 0.8);
const elev = +(q.get('elev') || 0.35);
const rsp = +(q.get('rsp') || 1.1);
const tx = +(q.get('tx') || 0), ty = q.get('ty') !== null ? +q.get('ty') : null;
const canvas = document.getElementById('c');
const r = new Renderer(canvas, { preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight);
const scene = new Scene();
scene.sky = { uniforms: { uZenith:[0.55,0.72,1.0], uHorizon:[0.98,0.9,0.95], uBottom:[0.9,0.88,0.98], uSkyExp:0.7, uSunGlow:[1,0.9,0.7], uSunSize:0.003, uStars:0, uAurora:0, uAurora1:[0,0,0], uAurora2:[0,0,0], uSwirl:0.3 } };
const ground = new Mesh(G.roundedBoxGeo(60, 1, 60, 0.3, 3), new Material({ color: q.get('bg') ? parseInt(q.get('bg'), 16) : 0xbfe8a8 }));
ground.position.y = -0.5; scene.add(ground);
const atlas = makeParticleAtlas();
const shadows = new BillboardBatch({ max: 100, atlas, flat: true, renderOrder: 10 });
scene.add(shadows);
const rigs = [];
const rows = Math.ceil(ids.length / cols);
ids.forEach((id, i) => {
  const cx = (i % cols) - (cols - 1) / 2, cz = Math.floor(i / cols) - (rows - 1) / 2;
  const arg = fnName === 'buildSomiGirl' ? { cape: id.includes('cape') } : id;
  const rset = (k) => { const v = q.get('r' + k); if (v && mod.ANIMAL_SPECS && mod.ANIMAL_SPECS[id]) { const a = v.split(','); mod.ANIMAL_SPECS[id].ribbon[k] = +a[i % a.length]; } };
  ['tilt', 'pitch', 'yaw', 's', 'out', 'roll'].forEach(rset);
  const _t0 = performance.now();
  const rig = mod[fnName](arg);
  if (q.get('timing')) { const _t1 = performance.now(); const r2 = mod[fnName](arg); const _t2 = performance.now(); console.log('BUILD ' + id + ' cold=' + (_t1 - _t0).toFixed(1) + 'ms warm=' + (_t2 - _t1).toFixed(1) + 'ms'); void r2; }
  const node = rig.root || rig;
  node.position.set(cx * spacing, 0, cz * spacing * rsp);
  node.rotation.y = yaws.length ? yaws[i % yaws.length] : yaw;
  scene.add(node);
  const lb = document.createElement('div'); lb.className = 'lb'; lb.textContent = id + (anims.length ? ':' + anims[i % anims.length] : '');
  if (q.get('labels') !== '0') document.body.appendChild(lb);
  rigs.push({ rig, node, id, lb, anim: anims.length ? anims[i % anims.length] : anim });
});
const cam = new Camera(35, 0.1, 500);
const w = cols * spacing, d = rows * spacing;
const dist = camDist || Math.max(w * 1.25, d * 1.6, 3.2);
cam.position.set(0, camH + dist * elev, dist);
cam.target.set(tx, ty !== null ? ty : camH * 0.75, 0);
cam.position.x += tx;
let t = 0; window.__frames = 0;
const tParam = q.get('t') !== null ? +q.get('t') : null;
const st = (R) => ({ anim: R.anim, t: tParam !== null ? tParam : t, speed: +(q.get('speed') || 0.8), vy: +(q.get('vy') || 0), attackKind: q.get('ak') || 'punch', specialKind: q.get('sk') || 'cast' });
const neckK = q.get('neck') !== null ? +q.get('neck') : null;
function step(dt) { t += dt; for (const R of rigs) { if (neckK !== null && R.rig.neckExt) R.rig.neckExt.scale.y = neckK; if (R.rig.update) R.rig.update(dt, st(R)); } }
const pre = +(q.get('pre') || 0);
for (let i = 0; i < pre * 60; i++) step(1 / 60);
function stats() {
  const out = {};
  scene.updateWorld();
  const v = new Vec3();
  for (const R of rigs) {
    let meshes = 0, vis = 0, minY = 1e9, maxY = -1e9, minYn = '';
    R.node.traverse((n) => {
      if (!n.isMesh) return;
      meshes++;
      // visible chain?
      let p = n, ok = true; while (p) { if (!p.visible) { ok = false; break; } p = p.parent; }
      if (!ok) return; vis++;
      const pos = n.geometry.attributes.position.array, m = n.worldMatrix;
      for (let k = 0; k < pos.length; k += 3) {
        v.set(pos[k], pos[k + 1], pos[k + 2]).applyMat4(m);
        if (v.y < minY) { minY = v.y; minYn = n.name || (n.parent && n.parent.name) || '?'; }
        if (v.y > maxY) maxY = v.y;
      }
    });
    out[R.id] = { meshes, vis, minY: +minY.toFixed(3), minYn, maxY: +maxY.toFixed(3) };
  }
  return out;
}
window.__stats = stats;
if (q.get('stats')) console.log('STATS ' + JSON.stringify(stats()));
const freeze = q.get('freeze') === '1';
const maxf = +(q.get('maxf') || 0);
function frame(){
  const dt = 1/60; if (!freeze) step(dt); r.globals.uTime = t;
  shadows.begin();
  for (const R of rigs) {
    shadows.push(R.node.position.x, 0.01, R.node.position.z, 0.9, 0.15,0.1,0.3,0.32, 0, 14);
    const p = cam.project(new Vec3(R.node.position.x, -0.02, R.node.position.z + 0.45));
    R.lb.style.left = (p.x * innerWidth) + 'px'; R.lb.style.top = (p.y * innerHeight) + 'px';
  }
  r.render(scene, cam);
  window.__frames++;
  if (!maxf || window.__frames < maxf) requestAnimationFrame(frame);
}
frame();
</script></body></html>
