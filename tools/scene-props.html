const S = SC[name] || SC.meadow;
const canvas = document.getElementById('c');
const r = new Renderer(canvas, { preserveDrawingBuffer: true });

const scene = new Scene();
scene.sky = { uniforms: SK[S.sky] };
if (S.night) { const g = r.globals; g.uSunColor.set([0.62, 0.64, 0.88]); g.uSkyColor.set([0.42, 0.45, 0.78]); g.uGroundColor.set([0.3, 0.28, 0.45]); g.uFogColor.set([0.32, 0.3, 0.55]); }
if (S.ground !== null) {
  const isl = new Mesh(G.cylinderGeo(13, 10.5, 2.5, 48, 1, true), new Material({ color: S.ground, spec: 0, rim: 0.2 }));

  const dirt = new Mesh(G.coneGeo(10.4, 7, 24), new Material({ color: 0xc9a283, rim: 0.2 }));

    for (const part of propParts(it.id, it.opts)) {
      const m = part.matrix ? Mat4.multiply(Mat4.create(), W, part.matrix) : W;
      mergeLists[part.halo ? 'halo' : part.kind].push({ geo: part.geo, matrix: m, color: part.color });
    }
    shadowPts.push([it.x, it.z, 1.0]);
    continue;
  }
  if (it.k === 'p') node = buildProp(it.id, it.opts);
  else if (it.k === 'o') { o = buildObject(it.id, it.opts); node = o.root; if (it.call) (new Function('o', it.call))(o); }

  node.rotation.y = it.yaw || 0;
  scene.add(node);

    for (let i = 0; i < 9; i++) {
      ig.setTransformAt(i, -3.0 + v * 2.0 + (i % 3) * 0.32, 0, -0.5 + Math.floor(i / 3) * 0.3, 0, i * 2.1, 0, 1.0 + (i % 2) * 0.2);
      fl.setTransformAt(i, -3.0 + v * 2.0 + (i % 3) * 0.32, 0, 1.0 + Math.floor(i / 3) * 0.3, 0, i * 2.1, 0, 1.2);
      if (v === 2) fl.setColorAt(i, 1, 0.85 + (i % 3) * 0.05, 1);

  const gm = propMaterial('solid', 0.05);
  for (let v = 0; v < 4; v++) {
    const n = name === 'sea' || name === 'canyon' ? 20 : 70;
    const ig = new InstancedMesh(grassGeo(v), gm, n), fl = new InstancedMesh(flowerGeo(v), gm, 14);
    for (let i = 0; i < n; i++) { const a = rng.next() * 6.28, d = 2 + rng.next() * 9; const s = 0.8 + rng.next() * 0.6; ig.setTransformAt(i, Math.cos(a) * d, 0, Math.sin(a) * d * 0.8, 0, rng.next() * 6, 0, s); }
    for (let i = 0; i < 14; i++) { const a = rng.next() * 6.28, d = 2.5 + rng.next() * 8; fl.setTransformAt(i, Math.cos(a) * d, 0, Math.sin(a) * d * 0.8, 0, rng.next() * 6, 0, 1 + rng.next() * 0.4); }
    ig.count = n; fl.count = name === 'canyon' ? 4 : 14; scene.add(ig, fl);
  }

scene.add(cat.root);
const cam = new Camera(38, 0.1, 500);

  const now = performance.now(), dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (q.get('freeze') !== '1') step(dt);
  r.globals.uTime = t;
  shadows.begin();
  for (const [x, z, s] of shadowPts) shadows.push(x, 0.01, z, s, 0.15, 0.1, 0.3, 0.22, 0, 14);
  shadows.push(cat.root.position.x, cat.root.position.y + 0.01, cat.root.position.z, 0.9, 0.15, 0.1, 0.3, 0.3, 0, 14);
  r.render(scene, cam);
  document.getElementById('info').textContent = `${name}  calls ${r.stats.calls}  tris ${Math.round(r.stats.tris)}`;
  window.__frames++;
  requestAnimationFrame(frame);
}
frame();
